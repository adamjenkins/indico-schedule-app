# Serving the schedule app from the Indico host.
#
# Include these blocks in the Indico server{} block, or copy them into the
# vhost directly. Ordering against Indico's catch-all `location /` does not
# matter: nginx picks the longest matching prefix, and `/schedule-app/` is
# longer than `/`.
#
# The whole design depends on this being the SAME ORIGIN as Indico. That is
# what lets the browser send the user's existing session cookie, which is why
# the app has no login screen and makes no cross-origin request.

# The app itself. `try_files` sends unknown paths to index.html so the app's
# own routes (/schedule-app/event/123/2026-09-04) survive a reload or a shared
# link — the server does not need to know them.
location /schedule-app/ {
    alias /srv/schedule-app/;
    try_files $uri $uri/ /schedule-app/index.html;
}

# The service worker must never be cached: a stale one pins every visitor to an
# old build, and there is no way to push a fix to a browser that will not
# re-fetch it. This is the single most important line in the file.
location = /schedule-app/sw.js {
    alias /srv/schedule-app/sw.js;
    add_header Cache-Control "no-store" always;
}

# Everything under assets/ is content-hashed by the build, so a changed file is
# a changed URL and it is safe to cache permanently.
location /schedule-app/assets/ {
    alias /srv/schedule-app/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
