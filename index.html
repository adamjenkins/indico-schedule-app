<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Without viewport-fit=cover the app stops short of the notch on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2733" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Your conference schedule, offline." />
    <!-- iOS ignores the manifest for standalone mode; these are what it reads. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Schedule" />
    <link rel="manifest" href="/schedule-app/manifest.webmanifest" />
    <link rel="icon" href="/schedule-app/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/schedule-app/icons/icon-192.png" />
    <title>Schedule</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
